<header class="career-tools-hero">
    <div>
        <div class="career-tools-eyebrow">Working professional toolkit</div>
        <h1>Move from experience to your next opportunity.</h1>
        <p>Diagnose the resume, sharpen the career story, build missing proof, and keep every application moving.</p>
    </div>
    <div class="career-tools-mark" aria-hidden="true">15</div>
</header>

<div class="career-tools-return-row">
    <a class="career-tools-return-link" href="{{ url_for('resume.resume_dashboard') }}">
        <span aria-hidden="true">&larr;</span> Back to resume dashboard
    </a>
</div>

<nav class="career-tools-nav" aria-label="Career tools">
    <a class="{% if active_tool == 'home' or active_tool == 'professional-suite' %}is-active{% endif %}" href="{{ url_for('career_tools.professional_suite') }}">Professional suite</a>
    <a class="{% if active_tool == 'job-matcher' %}is-active{% endif %}" href="{{ url_for('career_tools.job_matcher') }}">Role match</a>
    <a class="{% if active_tool == 'cover-letter' %}is-active{% endif %}" href="{{ url_for('career_tools.cover_letter') }}">Cover letter</a>

</nav>
