    </div>
    <div class="career-tools-mark" aria-hidden="true">05</div>
</header>

    <a class="{% if active_tool == 'application-tracker' %}is-active{% endif %}" href="{{ url_for('career_tools.application_tracker') }}">Applications</a>
    <a class="{% if active_tool == 'resume-tailor' %}is-active{% endif %}" href="{{ url_for('career_tools.resume_tailor') }}">Resume tailor</a>
    <a class="{% if active_tool == 'cover-letter' %}is-active{% endif %}" href="{{ url_for('career_tools.cover_letter') }}">Cover letter</a>
    <a class="{% if active_tool == 'skill-gap' %}is-active{% endif %}" href="{{ url_for('career_tools.skill_gap') }}">Skill gaps</a>
