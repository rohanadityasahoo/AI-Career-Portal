{% if ai_insight %}
<section class="career-tool-panel career-ai-panel mt-4">
    <div class="d-flex justify-content-between align-items-start gap-3">
        <div>
            <div class="career-tools-eyebrow">AI coaching</div>
            <h2>{{ ai_insight.title }}</h2>
        </div>
        <span class="career-ai-badge">AI assisted</span>
    </div>
    <p class="career-ai-summary">{{ ai_insight.summary }}</p>
    {% if ai_insight['items'] %}
    <div class="career-ai-insight-list">
        {% for item in ai_insight['items'] %}
        <article>
            <strong>{{ item.heading }}</strong>
            <p>{{ item.body }}</p>
        </article>
        {% endfor %}
    </div>
    {% endif %}
    {% if ai_insight.notice %}<small class="career-ai-notice">{{ ai_insight.notice }}</small>{% endif %}
</section>
{% endif %}
