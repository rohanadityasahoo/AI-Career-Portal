{% extends "layouts/base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>Career Roadmap Generator</h2>

    <form method="POST">

        <input
            type="text"
            name="career"
            class="form-control"
            placeholder="Enter Career"
            required
        >

        <br>

        <button
            class="btn btn-primary"
            type="submit"
        >
            Generate Roadmap
        </button>

    </form>

    {% if roadmap_steps %}

        <hr>

        <h4>Your Roadmap</h4>

        <ol>

            {% for step in roadmap_steps %}
                <li>{{ step }}</li>
            {% endfor %}

        </ol>

    {% endif %}

</div>

{% endblock %}
