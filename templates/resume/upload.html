{% extends "layouts/base.html" %}

{% block title %}
Resume Analyzer | CareerPilot AI
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="mb-2">
                        AI Resume Analyzer
                    </h2>

                    <p class="text-muted mb-4">
                        Upload your resume and let AI analyze its ATS compatibility, structure, skills, content, and overall quality.
                    </p>

                    <form method="POST"
                          enctype="multipart/form-data">

                        <!-- Resume -->
                        <div class="mb-3">

                            <label for="resume" class="form-label">
                                Resume PDF
                            </label>

                            <input type="file"
                                   id="resume"
                                   name="resume"
                                   class="form-control"
                                   accept=".pdf"
                                   required>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">

                            Analyze Resume

                        </button>

                        <a href="{{ url_for('resume.resume_history') }}"
                        class="btn btn-outline-secondary w-100 mt-2">

                            View Analysis History

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
